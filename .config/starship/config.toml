"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
[ ](bg:peach)\
$os\
$username\
[](bg:yellow fg:peach)\
$directory\
[](fg:yellow bg:teal)\
$git_branch\
$git_status\
[](fg:teal bg:blue)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:blue bg:overlay1)\
$docker_context\
$conda\
$pixi\
[](fg:overlay1 bg:surface1)\
$time\
$line_break$character"""

[os]
disabled = false
style = "bg:peach fg:text"

[os.symbols]
Ubuntu = "󰕈"
Raspbian = "󰐿"
Macos = "󰀵"
Fedora = "󰣛"
Alpine = ""
Android = ""
Arch = "󰣇"
Debian = "󰣚"
Redhat = "󱄛"

[username]
show_always = true
style_user = "bg:peach fg:text"
style_root = "bg:peach fg:text"
format = '[ $user ]($style)'

[directory]
style = "fg:text bg:yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:teal"
format = '[[ $symbol $branch ](fg:text bg:teal)]($style)'

[git_status]
style = "bg:teal"
format = '[[($all_status$ahead_behind )](fg:text bg:teal)]($style)'

[nodejs]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:text bg:blue)]($style)'

[bun]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:text bg:blue)]($style)'

[c]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:text bg:blue)]($style)'

[cpp]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:text bg:blue)]($style)'

[rust]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:text bg:blue)]($style)'

[golang]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:text bg:blue)]($style)'

[php]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:text bg:blue)]($style)'

[java]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:text bg:blue)]($style)'

[kotlin]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:text bg:blue)]($style)'

[haskell]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:text bg:blue)]($style)'

[python]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:text bg:blue)]($style)'

[docker_context]
symbol = ""
style = "bg:overlay1"
format = '[[ $symbol( $context) ](fg:text bg:overlay1)]($style)'

[conda]
style = "bg:overlay1"
format = '[[ $symbol( $environment) ](fg:text bg:overlay1)]($style)'

[pixi]
style = "bg:overlay1"
format = '[[ $symbol( $version)( $environment) ](fg:text bg:overlay1)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:surface1"
format = '[[  $time ](fg:text bg:surface1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[▶](bold fg:green)'
error_symbol = '[▶](bold fg:red)'
vimcmd_symbol = '[◀](bold fg:green)'
vimcmd_replace_one_symbol = '[◀](bold fg:mauve)'
vimcmd_replace_symbol = '[◀](bold fg:mauve)'
vimcmd_visual_symbol = '[◀](bold fg:yellow)'

